[hooks]
postinstall = [
  "{% set is_in_ci = get_env(name='CI', default='') %}{% if is_in_ci %}echo 'Not setting up git hooks as mise is running in CI!'{% else %}prek install -f -c .config/prek.toml{% endif %}",
]

[settings]
experimental = true # Needed for hooks as of v2025.6.2

[env]
# Centralize tool caches under .cache/ instead of scattering them across the repo root.
PYTHONPYCACHEPREFIX = ".cache/pycache"
RUMDL_CACHE_DIR = ".cache/rumdl"
PYTEST_ADDOPTS = "-o cache_dir=.cache/pytest"
RUFF_CACHE_DIR = ".cache/ruff"

[tasks.copier-update]
run = "copier update --answers-file .config/copier-answers.yml --skip-answered --trust"

[tasks.set-lifecycle]
# Re-prompts just the `lifecycle` question (--ask overrides --skip-answered for it,
# showing its normal choice menu with the current value pre-selected) without pulling
# in a template update alongside it -- `--vcs-ref=:current:` pins the update to the
# currently-installed template version instead of the latest one. Both flags' minimum
# copier versions are enforced by this project's own _min_copier_version.
run = "copier update --answers-file .config/copier-answers.yml --skip-answered --trust --vcs-ref=:current: --ask lifecycle"

[tasks.docs-server]
run = "zensical serve"

[tasks.test]
run = "pytest tests/"

[tasks.integration-test-gh]
# Same script test-integration_test.yml runs in CI (--cleanup added there) -- see
# that file for what this actually verifies and why. Repo is left in place here by
# default so it can be inspected; pass --cleanup yourself to delete it. Uses the
# `usage` field (not the deprecated option() Tera function) so --branch is passed to
# the script as a real env var (usage_branch) rather than templated into the command
# line -- works identically regardless of the invoking shell/platform.
usage = '''
flag "--branch <branch>" help="Template ref to test against" default="HEAD"
'''
run = "python scripts/integration_test_github.py --source https://github.com/natescherer/postmodern-repo-copiertemplate --repo-prefix postmodern-repo-copiertemplate"

[tasks.integration-test-azdo]
# Same script test-integration_test.yml runs in CI (--cleanup added there) -- see
# that file for what this actually verifies and why. Repo is left in place here by
# default so it can be inspected; pass --cleanup yourself to delete it. --org/--project
# default to this project's own Azure DevOps org/project when using_azdo, otherwise
# there's no natural default and they must be passed explicitly, e.g.
# `mise run integration-test-azdo -- --org myorg --project myproject`. Uses the
# `usage` field (not the deprecated option() Tera function) so these are passed to
# the script as real env vars (usage_branch/usage_org/usage_project) rather than
# templated into the command line -- works identically regardless of the invoking
# shell/platform, and (unlike option()) a missing required value doesn't silently
# vanish from the command line and desync argparse.
usage = '''
flag "--branch <branch>" help="Template ref to test against" default="HEAD"
flag "--org <org>" help="Azure DevOps organization"
flag "--project <project>" help="Azure DevOps project"
'''
run = "python scripts/integration_test_azdo.py --source https://github.com/natescherer/postmodern-repo-copiertemplate --repo-prefix postmodern-repo-copiertemplate"

[tools]
# Backends
python = "3.14.7" # Used by copier
uv = "0.12.2" # Used by pipx tools
# Tools
actionlint = "1.7.12"
"aqua:cli/cli" = "2.97.0"
"aqua:crate-ci/typos" = "1.49.0"
"aqua:j178/prek" = "0.4.12"
"aqua:owenlamont/ryl" = "0.21.0"
"aqua:tombi-toml/tombi" = "1.2.6"
committed = "1.1.11"
lychee = "0.15.1"
ruff = "0.16.1"
rumdl = "0.2.52"
shellcheck = "0.11.0"

[tools."pipx:copier"]
version = "9.17.1"
uvx_args = "--with jinja2-shell-extension==2.1.1"

[tools."pipx:pytest"]
version = "9.1.1"
# pytest-github-actions-annotate-failures / pytest-azurepipelines surface pytest
# failures and warnings as native platform annotations (::warning::/::error:: on
# GitHub, ##vso[task.logissue] on Azure DevOps) with zero config -- they auto-detect
# their CI via the env vars each platform already sets.
uvx_args = "--with pyyaml==6.0.3 --with jinja2==3.1.6 --with jinja2-ansible-filters==1.3.2 --with pytest-github-actions-annotate-failures==0.4.2"

[tools."pipx:zensical"]
version = "0.0.53"
uvx_args = "--with git+https://github.com/squidfunk/mike.git@2.2.0+zensical-0.1.0"
