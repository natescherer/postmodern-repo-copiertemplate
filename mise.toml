[hooks]
postinstall = [
  "{% set is_in_ci = get_env(name='CI', default='') %}{% if is_in_ci %}echo 'Not setting up git hooks as mise is running in CI!'{% else %}prek install -f -c .config/prek.toml{% endif %}",
]

[settings]
experimental = true # Needed for hooks as of v2025.6.2

[tasks.copier-update]
run = "copier update --answers-file .config/copier-answers.yml --skip-answered --trust"

[tasks.docs-server]
run = "zensical serve"

[tasks.test]
run = "pytest tests/"

[tasks.integration-test-gh]
run = '''
copier copy --trust --vcs-ref={{option(name="branch",default="HEAD")}} -d 'repo_setup_actions=Create Repo' -d 'developer_platform=GitHub' -d 'project_description=Integration Test - NOT FOR PUBLIC USE' -d 'project_type=Template' -d 'project_name=Integration Test' -d 'project_visibility=Public' -d 'license=MIT' -d 'lifecycle=Pre-Alpha' https://github.com/natescherer/postmodern-repo-copiertemplate {{option(name="path")}}
'''

[tasks.integration-test-azdo]
run = '''
copier copy --trust --vcs-ref={{option(name="branch",default="HEAD")}} -d 'repo_setup_actions=Create Repo' -d 'developer_platform=Azure DevOps' -d 'project_description=Integration Test - NOT FOR PUBLIC USE' -d 'project_type=Template' -d 'project_name=Integration Test' -d 'project_visibility=Private' -d 'license=None' -d 'lifecycle=Pre-Alpha' https://github.com/natescherer/postmodern-repo-copiertemplate {{option(name="path")}}
'''

[tools]
# Backends
python = "3.14.7" # Used by copier
uv = "0.12.2" # Used by pipx tools
# Tools
actionlint = "1.7.12"
"aqua:crate-ci/typos" = "1.49.0"
"aqua:j178/prek" = "0.4.12"
"aqua:owenlamont/ryl" = "0.21.0"
"aqua:tombi-toml/tombi" = "1.2.6"
committed = "1.1.11"
lychee = "0.15.1"
ruff = "0.16.1"
rumdl = "0.2.52"
shellcheck = "0.11.0"

[tools."pipx:copier"]
version = "9.17.1"
uvx_args = "--with jinja2-shell-extension==2.1.1"

[tools."pipx:pytest"]
version = "9.1.1"
# pytest-github-actions-annotate-failures / pytest-azurepipelines surface pytest
# failures and warnings as native platform annotations (::warning::/::error:: on
# GitHub, ##vso[task.logissue] on Azure DevOps) with zero config -- they auto-detect
# their CI via the env vars each platform already sets.
uvx_args = "--with pyyaml==6.0.3 --with jinja2==3.1.6 --with jinja2-ansible-filters==1.3.2 --with pytest-github-actions-annotate-failures==0.4.2"

[tools."pipx:invoke"]
version = "3.0.3"
uvx_args = "--with copier==9.17.1 --with githubkit==0.16.0 --with requests==2.34.2 --with rich==15.0.0"

[tools."pipx:zensical"]
version = "0.0.53"
uvx_args = "--with git+https://github.com/squidfunk/mike.git@2.2.0+zensical-0.1.0"
