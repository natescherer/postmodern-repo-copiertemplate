[files]
yaml = [
  "*.yaml",
  "*.yml",
  "*.yaml{% endif %}",
  "*.yml{% endif %}",
]

[rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
document-end = "disable"
document-start = "disable"
empty-lines = "enable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
key-ordering = "disable"
line-length = "disable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
quoted-strings = "disable"
trailing-spaces = "enable"

[rules.comments]
level = "warning"
min-spaces-from-content = 1

[rules.comments-indentation]
level = "warning"

[rules.truthy]
level = "warning"

[[per-line-ignores]]
# GitHub Actions files are improper YAML in some ways
regex = "^on:$"
rules = ["truthy"]
