name: Re-enable Workflow
description: Re-enables the calling workflow on each run, so GitHub doesn't disable it for inactivity.
runs:
  using: composite
  steps:
    # Inlined from liskin/gh-workflow-keepalive, whose one step is pinned to
    # `shell: sh`, unsupported on Windows runners, unlike bash, which is available
    # there via Git for Windows.
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |-
        case "${GITHUB_WORKFLOW_REF:?}" in
          "${GITHUB_REPOSITORY:?}"/.github/workflows/*.y*ml@*) ;;
          *) false ;;
        esac
        workflow="${GITHUB_WORKFLOW_REF%%@*}"
        workflow="${workflow#"$GITHUB_REPOSITORY"/.github/workflows/}"
        gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
