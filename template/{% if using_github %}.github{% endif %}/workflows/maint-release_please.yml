name: "[Maint] Release Please"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Secrets Exist
        uses: ./.github/actions/require-secrets
        with:
          secrets: |
            REPO_MAINTENANCE_PAT=${{ secrets.REPO_MAINTENANCE_PAT }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.REPO_MAINTENANCE_PAT }}
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
