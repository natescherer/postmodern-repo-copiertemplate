name: "Maint (Auto): Repo Health Check"

on:
  schedule:
    - cron: 0 18 * * 1 # Every Monday at 6pm UTC (offset from the other Monday jobs)
  workflow_dispatch:

env:
  MISE_ENV: ci

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: Check for Broken Links
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- lychee --no-progress -c .config/lychee.toml .
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      # Re-enables this workflow if GitHub disabled it for inactivity. Inlined from
      # liskin/gh-workflow-keepalive, whose one step is pinned to `shell: sh`,
      # unsupported on Windows runners, unlike bash, which is available there via Git
      # for Windows.
      - name: Re-enable Workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "${GITHUB_WORKFLOW_REF:?}" in
            "${GITHUB_REPOSITORY:?}"/.github/workflows/*.y*ml@*) ;;
            *) false ;;
          esac
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow#"$GITHUB_REPOSITORY"/.github/workflows/}"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
