name: "Maint (Auto): Repo Health Check"

on:
  schedule:
    - cron: 0 18 1 * * # 1st of each month at 6pm UTC
  workflow_dispatch:

env:
  MISE_ENV: ci

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
      - name: Check for Broken Links
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- lychee --no-progress -c .config/lychee.toml .
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
      - name: Re-enable Workflow
        uses: ./.github/actions/reenable-workflow
