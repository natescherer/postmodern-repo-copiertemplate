name: "Release (Auto): Prepare Release PR"

on:
  push:
    branches: [main]

# Each run force-pushes knope/release, so only the newest one should finish.
concurrency:
  group: knope-release-pr
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  autoupdate-knope-pr:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        # token: the default GITHUB_TOKEN, explicitly, not a PAT. Since June 2026,
        # GitHub gates pull_request-triggered runs (e.g. PR Validation on the release
        # PR below) behind manual approval whenever the PR traces back to the default
        # token's github-actions[bot] identity; see
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow.
        # That means every push here requires a human to click "Approve and run
        # workflow" on the resulting PR Validation run before branch protection lets
        # the release PR merge; confirmed live, including that the gate reapplies on
        # every subsequent push to the same PR, not just once. Accepted deliberately:
        # a PAT (or GitHub App) avoids the approval step but doesn't work in an
        # enterprise context where PATs are commonly restricted.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          version: 2026.10.10 # jdx/mise
      - name: Prepare Release PR
        shell: bash
        # .config/knope-release-override.json can pin the next release's version (e.g. a
        # project's first release, or 1.0.0); it's ignored once the released version
        # reaches it. "Nothing release-worthy since the last release" is a normal outcome,
        # not a failure, so only that specific knope error is tolerated.
        run: |
          args=()
          override=""
          if [ -f .config/knope-release-override.json ]; then
            override=$(mise x -- jq -r '.version // empty' .config/knope-release-override.json)
          fi
          if [ -n "$override" ]; then
            if ! printf '%s' "$override" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::.config/knope-release-override.json has version '$override', which isn't X.Y.Z."
              exit 1
            fi
            current=$(mise x -- jq -r .version .config/knope-current-version.json)
            if [ "$override" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$override" | sort -V | tail -n 1)" = "$override" ]; then
              echo "Pinning this release to $override (from .config/knope-release-override.json)."
              args=(--override-version "$override")
            fi
          fi
          log=$(mktemp)
          set +e
          mise x -- knope autoupdate-knope-pr "${args[@]}" --verbose 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q 'releases::no_release' "$log"; then
            echo "Nothing to release yet."
            exit 0
          fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
