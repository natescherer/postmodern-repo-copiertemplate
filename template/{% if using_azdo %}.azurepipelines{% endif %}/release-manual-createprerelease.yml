name: $(BuildId)

trigger:
  branches:
    exclude:
      - "*"

parameters:
  - name: label
    displayName: Prerelease label
    type: string
    default: alpha
    values:
      - alpha
      - beta
      - rc

variables:
  CI: true
  MISE_ENV: ci

pool:
  vmImage: ubuntu-latest

stages:
  - stage: prerelease
    displayName: Prerelease
    jobs:
      - job: prerelease
        timeoutInMinutes: 15
        displayName: Prerelease
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
          - pwsh: |
              git config user.email "azuredevops@microsoft.com"
              git config user.name "Azure DevOps"
            displayName: Set Git Config
          - bash: |
              # renovate: datasource=github-releases depName=jdx/mise
              curl https://mise.run | MISE_VERSION=v2026.10.10 MISE_INSTALL_SKIP_IF_EXISTS=1 sh
              echo "##vso[task.prependpath]$(HOME)/.local/share/mise/bin"
              echo "##vso[task.prependpath]$(HOME)/.local/share/mise/shims"
            displayName: Install Mise
          - task: Cache@2
            inputs:
              key: 'mise | "$(Agent.OS)" | mise.toml | mise.ci.toml'
              restoreKeys: |
                mise | "$(Agent.OS)"
              path: $(HOME)/.local/share/mise
            displayName: Cache Mise Tools
          - bash: |
              # The optional GITHUB_COM_TOKEN pipeline variable keeps mise's downloads
              # from hitting github.com's unauthenticated rate limit, which hosted agents
              # share by IP; when it isn't defined, Azure Pipelines passes the literal
              # macro text, so that's treated as unset.
              case "$GITHUB_TOKEN" in ''|'$('*) unset GITHUB_TOKEN ;; esac
              mise install
            displayName: Run 'mise install'
            env:
              GITHUB_TOKEN: $(GITHUB_COM_TOKEN)
          - pwsh: |
              $Label = "${{ parameters.label }}"
              $Tags = git tag --points-at HEAD
              $Duplicate = $Tags | Where-Object { $_ -match "-$([regex]::Escape($Label))\.\d+$" }
              if ($Duplicate) {
                Write-Host "##vso[task.logissue type=error]This commit is already tagged as $Duplicate; push a new commit before cutting another $Label prerelease."
                throw "Duplicate prerelease"
              }
            displayName: Block Duplicate Prerelease
          - bash: |
              # A version pinned in .config/knope-release-override.json (and not yet released) makes
              # prereleases count up toward it (e.g. 1.0.0-rc.0, 1.0.0-rc.1) instead of the
              # version knope would compute.
              override=""
              if [ -f .config/knope-release-override.json ]; then
                override=$(mise x -- jq -r '.version // empty' .config/knope-release-override.json) || {
                  echo "##vso[task.logissue type=error]Couldn't read .config/knope-release-override.json."
                  exit 1
                }
              fi
              current=$(mise x -- jq -r .version .config/knope-current-version.json)
              if printf '%s' "$override" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
                && [ "$override" != "$current" ] \
                && [ "$(printf '%s\n%s\n' "$current" "$override" | sort -V | tail -n 1)" = "$override" ]; then
                n=$(git tag -l "v$override-$LABEL.*" | wc -l)
                mise x -- knope create-prerelease-via-knope --override-version "$override-$LABEL.$n" --verbose
              else
                mise x -- knope create-prerelease-via-knope --prerelease-label "$LABEL" --verbose
              fi
            displayName: Create Prerelease
            env:
              LABEL: ${{ parameters.label }}
          - pwsh: |
              $Content = Get-Content .config/knope-current-version.json -Raw | ConvertFrom-Json
              Write-Host "##vso[task.setvariable variable=VERSION]$($Content.version)"
            displayName: Capture Version
          - pwsh: |
              $TagUrl = "$(System.CollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)?version=GTv$(VERSION)"
              Write-Host "##vso[task.logissue type=warning]Prerelease published: v$(VERSION) ($TagUrl)"
            displayName: Emit Release Notice
