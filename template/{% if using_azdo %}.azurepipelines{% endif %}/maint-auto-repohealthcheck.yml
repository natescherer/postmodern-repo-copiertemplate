name: $(BuildId)

trigger:
  branches:
    exclude:
      - "*"

schedules:
  # Offset from Renovate (00:00 on the 1st) to avoid runner contention.
  - cron: 0 18 1 * *
    displayName: Check for Broken Links on the 1st of Each Month at 6pm UTC
    branches:
      include:
        - main
    # Azure Pipelines skips a scheduled run when main hasn't changed since the last
    # one by default; these checks matter most in a quiet repo.
    always: true

variables:
  CI: true
  MISE_ENV: ci

pool:
  vmImage: ubuntu-latest

stages:
  - stage: repo_health_check
    displayName: Repo Health Check
    jobs:
      - job: link_check
        timeoutInMinutes: 15
        displayName: Link Check
        steps:
          - checkout: self
          - bash: |
              # renovate: datasource=github-releases depName=jdx/mise
              curl https://mise.run | MISE_VERSION=v2026.10.10 MISE_INSTALL_SKIP_IF_EXISTS=1 sh
              echo "##vso[task.prependpath]$(HOME)/.local/share/mise/bin"
              echo "##vso[task.prependpath]$(HOME)/.local/share/mise/shims"
            displayName: Install Mise
          - task: Cache@2
            inputs:
              key: 'mise | "$(Agent.OS)" | mise.toml | mise.ci.toml'
              restoreKeys: |
                mise | "$(Agent.OS)"
              path: $(HOME)/.local/share/mise
            displayName: Cache Mise Tools
          - bash: mise install
            displayName: Run 'mise install'
          - bash: |
              # The optional GITHUB_COM_TOKEN pipeline variable keeps github.com links
              # from hitting its unauthenticated rate limit; when it isn't defined, Azure
              # Pipelines passes the literal macro text, so that's treated as unset.
              case "$GITHUB_TOKEN" in ''|'$('*) unset GITHUB_TOKEN ;; esac
              mise x -- lychee --no-progress -c .config/lychee.toml .
            displayName: Check for Broken Links
            env:
              GITHUB_TOKEN: $(GITHUB_COM_TOKEN)
