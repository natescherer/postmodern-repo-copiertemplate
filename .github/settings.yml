# Managed by the "Settings" GitHub App (https://github.com/apps/settings) -- do not
# edit repo settings in the GitHub UI, edit this file instead. Install the app with
# access to this repo for changes here to take effect; see docs/prerequisites.md.

repository:
  description: "A Copier template to create a repo with the hard/boring stuff automated, so you can get back to coding."
  homepage: "https://natescherer.github.io/postmodern-repo-copiertemplate"
  private: false

  # Deliberate overrides of GitHub's defaults
  allow_auto_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

# The Settings App treats this list as authoritative: any label that exists on the
# repo but isn't listed here gets deleted on sync -- including GitHub's own
# auto-created defaults (bug, enhancement, etc.), which is why they're listed
# explicitly below rather than left for GitHub to create on its own.
labels:
  # GitHub Defaults
  - name: accessibility
    color: f143ab
    description: Barrier affecting people with disabilities
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: invalid
    color: e4e669
    description: This doesn't seem right
  - name: question
    color: d876e3
    description: Further information is requested
  - name: wontfix
    color: ffffff
    description: This will not be worked on

  # Release Please -- "release-please" comes from release-please-config.json's
  # extra-label, applied to every PR it opens; the "autorelease: *" labels are its
  # own built-in defaults (pending while open, tagged once merged and released,
  # snooze to manually pause processing for a PR). "autorelease: snapshot" is included
  # for completeness even though this template's release-type (simple) never triggers
  # it -- that label's only used by Java/Maven-style snapshot releases.
  - name: release-please
    color: "5319e7"
    description: Applied to every pull request release-please opens
  - name: "autorelease: pending"
    color: fbca04
    description: A release PR is open, waiting to be merged
  - name: "autorelease: tagged"
    color: 0e8a16
    description: This PR was merged and its release has been tagged
  - name: "autorelease: snapshot"
    color: 1d76db
    description: A snapshot (pre-release) version was published
  - name: "autorelease: snooze"
    color: c5def5
    description: Pause release-please processing for this PR

  # Custom
  - name: awaiting pr
    color: 668F04
    description: Awaiting completion of a PR from a contributor
  - name: blocked
    color: B60205
    description: Blocked by an external dependency

rulesets:
  - name: default-branch-protection
    target: branch
    enforcement: active
    # actor_id 5 = the built-in "admin" repository role (undocumented by GitHub, but
    # widely confirmed: https://github.com/github/rest-api-description/issues/4406).
    # bypass_mode "pull_request" only lets an admin skip requirements when merging a
    # PR (the "Merge without waiting for requirements" button) -- it doesn't grant a
    # direct push past this ruleset the way "always" would.
    bypass_actors:
      - actor_type: RepositoryRole
        actor_id: 5
        bypass_mode: pull_request
    conditions:
      ref_name:
        exclude: []
        include: ["~DEFAULT_BRANCH"]
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
      - type: required_status_checks
        parameters:
          do_not_enforce_on_create: true
          # Matches the AzDO side's forced behavior (queue-on-source-update-only
          # false requires valid-duration 0, i.e. "recheck immediately when the
          # target branch updates") -- keeps both platforms equally strict.
          strict_required_status_checks_policy: true
          required_status_checks:
            # Job id from test-pr_validation.yml.jinja's "tests" job (no `name:` set,
            # so its check run name is the job id verbatim).
            - context: tests

environments:
  - name: github-pages
