name: "Release (Auto): Prepare Release PR"

on:
  push:
    branches: [main]
  # A manual run from the Actions tab cuts a prerelease instead (see Releasing).
  workflow_dispatch:
    inputs:
      label:
        description: "Prerelease label"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc

env:
  MISE_ENV: ci

jobs:
  autoupdate-knope-pr:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: prepare release')"
    # Each run force-pushes knope/release, so only the newest one should finish. Set
    # on this job, not the workflow, so a push never cancels a prerelease.
    concurrency:
      group: knope-release-pr
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        # The default GITHUB_TOKEN, not a PAT. GitHub holds pull_request runs (such as
        # PR Validation on the release PR) for manual approval when the PR traces back
        # to the token's github-actions[bot] identity, on every push to the PR; see
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow.
        # So each push here needs someone to click "Approve and run workflow" before the
        # release PR can merge. A PAT or GitHub App avoids that, but enterprises often
        # restrict PATs.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          version: 2026.10.10 # jdx/mise
      - name: Prepare Release PR
        shell: bash
        # .config/knope-release-override.json can pin the next release's version (such as
        # 1.0.0), and is ignored once the released version reaches it. Nothing to release
        # is a normal outcome, so that one knope error is tolerated.
        run: |
          args=()
          override=""
          if [ -f .config/knope-release-override.json ]; then
            override=$(mise x -- jq -r '.version // empty' .config/knope-release-override.json)
          fi
          if [ -n "$override" ]; then
            if ! printf '%s' "$override" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::.config/knope-release-override.json has version '$override', which isn't X.Y.Z."
              exit 1
            fi
            current=$(mise x -- jq -r .version .config/knope-current-version.json)
            if [ "$override" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$override" | sort -V | tail -n 1)" = "$override" ]; then
              echo "Pinning this release to $override (from .config/knope-release-override.json)."
              args=(--override-version "$override")
            fi
          fi
          log=$(mktemp)
          set +e
          mise x -- knope autoupdate-knope-pr "${args[@]}" --verbose 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q 'releases::no_release' "$log"; then
            echo "Nothing to release yet."
            exit 0
          fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  create-prerelease-via-knope:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Block Duplicate Prerelease
        shell: bash
        env:
          LABEL: ${{ inputs.label }}
        run: |
          duplicate=$(git tag --points-at HEAD | grep -E -- "-${LABEL}\.[0-9]+$" || true)
          if [ -n "$duplicate" ]; then
            echo "::error::This commit is already tagged as $duplicate; push a new commit before cutting another $LABEL prerelease."
            exit 1
          fi
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          version: 2026.10.10 # jdx/mise
      - name: Create Prerelease
        shell: bash
        # A version pinned in .config/knope-release-override.json (and not yet released) makes
        # prereleases count up toward it (e.g. 1.0.0-rc.0, 1.0.0-rc.1) instead of the
        # version knope would compute.
        run: |
          override=""
          if [ -f .config/knope-release-override.json ]; then
            override=$(mise x -- jq -r '.version // empty' .config/knope-release-override.json)
          fi
          current=$(mise x -- jq -r .version .config/knope-current-version.json)
          if printf '%s' "$override" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            && [ "$override" != "$current" ] \
            && [ "$(printf '%s\n%s\n' "$current" "$override" | sort -V | tail -n 1)" = "$override" ]; then
            n=$(git tag -l "v$override-$LABEL.*" | wc -l)
            mise x -- knope create-prerelease-via-knope --override-version "$override-$LABEL.$n" --verbose
          else
            mise x -- knope create-prerelease-via-knope --prerelease-label "$LABEL" --verbose
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ inputs.label }}
      - name: Capture Version
        id: version
        shell: bash
        run: |
          version=$(mise x -- jq -r '.version' .config/knope-current-version.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Emit Release Notice
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "::notice title=Prerelease Published::https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
