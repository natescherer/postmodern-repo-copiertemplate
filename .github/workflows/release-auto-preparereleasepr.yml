name: "Release (Auto): Prepare Release PR"

on:
  push:
    branches: [main]

jobs:
  autoupdate-knope-pr:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate Secrets Exist
        uses: ./.github/actions/require-secrets
        with:
          secrets: |
            REPO_MAINTENANCE_PAT=${{ secrets.REPO_MAINTENANCE_PAT }}
      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email github-actions@github.com
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: Prepare Release
        shell: bash
        run: mise x -- knope prepare-release-only --verbose
        continue-on-error: true
      - name: Capture Version and Changelog
        id: prepared
        shell: bash
        run: |
          version=$(mise x -- jq -r '.version' .config/knope-current-version.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            awk '/^## /{n++} n==1{print} n==2{exit}' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.REPO_MAINTENANCE_PAT }}
          commit-message: "chore: prepare release ${{ steps.prepared.outputs.version }}"
          branch: knope/release
          title: "chore: prepare release ${{ steps.prepared.outputs.version }}"
          body: |
            This PR was created by Knope. Merging it will create a new release (v${{ steps.prepared.outputs.version }}).

            ${{ steps.prepared.outputs.changelog }}

            - [ ] Integration tests have been run and passed (or N/A)
